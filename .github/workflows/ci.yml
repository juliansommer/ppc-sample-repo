name: Vowel Frequency CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build -t vowel-frequency-analyzer:latest .

      # Mount the workspace so README.md changes made in the container persist
      - name: Run Docker Container
        run: |
          docker run --rm \
            -e GITHUB_USER=${{ github.actor }} \
            -v ${{ github.workspace }}:/app \
            vowel-frequency-analyzer:latest

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "CI: Vowel frequency for ${{ github.actor }}" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase origin main
          git push origin main
