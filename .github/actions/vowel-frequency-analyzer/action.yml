name: Vowel Frequency Analyzer
description: Calculates the frequency of vowels in a text file and logs the result to README.md

inputs:
  file:
    description: Path to the text file to analyse
    required: true
    default: data.txt

runs:
  using: docker
  image: docker://ghcr.io/juliansommer/vowel-frequency-analyzer:latest
  entrypoint: /app/.github/scripts/entrypoint.sh
  env:
    FILE: ${{ inputs.file }}
